    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Organization","name":"Nepal Shop","url":"https://nepal-shop-2.onrender.com/","description":"Nepal Shop is a local multi-vendor marketplace: shop local, know who packed it.","logo":"https://nepal-shop-2.onrender.com/icon-512.png"}

  <body>
    <!-- Branded launch splash: shown instantly on cold start (PWA, browser and
         the Android WebView alike) and dismissed by main.tsx once the app
         boots. The inline fallback timer covers a failed/slow bundle load. -->
    <style>
      #launch-splash{position:fixed;inset:0;z-index:200;background:#A10417;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .4s ease}
      #launch-splash.done{opacity:0;pointer-events:none}
      #launch-splash img{width:104px;height:104px;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
      #launch-splash span{font:700 32px Georgia,serif;color:#fff;letter-spacing:.01em}
    </style>
    <div id="launch-splash" aria-hidden="true">
      <img src="./assets/icon-192-b4kfe021.png" alt="" />
      <span>NepalShop</span>
    </div>
    <script>
      setTimeout(function () {
        var s = document.getElementById("launch-splash");
        if (s) { s.classList.add("done"); setTimeout(function () { s.remove(); }, 450); }
      }, 4000);
    </script>
    <div
      data-generated-space-root=""
      data-generated-space-slug="nepal-shopping-site"
    ></div>
  </body>
